<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问卷星跳转诊断</title><style>body{background:#f3f7fb;color:#183349;margin:0;padding:25px;font:17px/1.65 -apple-system,system-ui,sans-serif}main{max-width:550px;margin:auto}section{background:white;padding:20px;border-radius:16px;margin:20px 0;border:1px solid #dce5ec}button{display:block;width:100%;padding:15px;margin-top:13px;border:0;border-radius:12px;background:#196c93;color:#fff;font:600 16px system-ui}button:nth-of-type(2){background:#417994}button:nth-of-type(3){background:#697f92}p{overflow-wrap:anywhere}.small{font-size:14px;color:#587185}code{font-size:14px;background:#edf3f7;padding:3px}</style></head><body><main><h1>问卷星 URL 片段诊断</h1><section><p>已确认 Safari 在普通网页保留 URL 片段。现在用<strong>不含个人信息</strong>的固定测试标记，检查打开问卷星后标记是否还在。</p><p class="small">此测试不输入姓名/学号，不填写、不点击报名、不提交。只使用您之前的已满额问卷。</p><button id="direct">测试 A：当前标签页打开问卷星</button><button id="blank">测试 B：新标签页打开问卷星</button><button id="copy">复制含测试标记的链接</button></section><section><strong>操作后看 V2 状态条</strong><p>重点查看“启动时片段”和“当前片段”。</p><p class="small">如果 A、B 都不存在，而普通 GitHub 页面都存在，说明问卷星导航/页面处理或 Safari 对该站点的跳转方式与普通页面不同；仍不能单靠这个测试证明是满额造成。</p><p id="status" aria-live="polite"></p></section></main><script>const target='https://www.wjx.top/vm/Q4hvy2R.aspx#wjxhelper=SAFARI_TEST_12345';document.getElementById('direct').onclick=()=>{location.assign(target)};document.getElementById('blank').onclick=()=>{const a=document.createElement('a');a.href=target;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();document.getElementById('status').textContent='已尝试打开新标签页；请切换查看 V2 状态条。'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(target);document.getElementById('status').textContent='已复制固定测试链接（无个人信息）。'}catch(e){document.getElementById('status').textContent='复制未成功，请使用上面的两个按钮。'}};</script></body></html>
